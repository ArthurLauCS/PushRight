  <path d="M628 352 L780 470 L628 588" fill="none" stroke="url(#clay)" stroke-width="64" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- 提交节点 -->
  <circle cx="332" cy="300" r="70" fill="#1f1e1d" stroke="#f0eee6" stroke-width="44"/>
  <circle cx="332" cy="724" r="70" fill="#e08363" stroke="#f0eee6" stroke-width="44"/>
</svg>
