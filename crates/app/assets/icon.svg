<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <!-- 应用图标（40px 及以上）：黄色向右的箭头路牌，上面一条深色主干，分支从主干弯出去指向箭头尖 -->
  <defs>
    <linearGradient id="bg" gradientUnits="userSpaceOnUse" x1="20" y1="36" x2="242" y2="220">
      <stop offset="0" stop-color="#FFE45C"/>
      <stop offset="0.55" stop-color="#FACC15"/>
      <stop offset="1" stop-color="#E0A800"/>
    </linearGradient>
  </defs>
  <!-- 同色描边把五边形的角磨圆 -->
  <path d="M36 52 H164 L226 128 L164 204 H36 Z" fill="url(#bg)" stroke="url(#bg)" stroke-width="32" stroke-linejoin="round"/>
  <g fill="none" stroke="#2B2412" stroke-width="18" stroke-linecap="round">
    <path d="M78 84 V172"/>
    <path d="M78 158 C78 128 100 128 150 128"/>
  </g>
  <!-- 提交节点 -->
  <g fill="#2B2412">
    <circle cx="78" cy="80" r="17"/>
    <circle cx="78" cy="176" r="17"/>
    <circle cx="160" cy="128" r="17"/>
  </g>
</svg>
