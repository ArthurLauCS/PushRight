<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a3935"/>
      <stop offset="1" stop-color="#1f1e1d"/>
    </linearGradient>
    <linearGradient id="clay" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#d6714f"/>
      <stop offset="1" stop-color="#ec9a7d"/>
    </linearGradient>
  </defs>
  <rect x="48" y="48" width="928" height="928" rx="216" fill="url(#bg)"/>
  <rect x="50" y="50" width="924" height="924" rx="214" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="4"/>
  <!-- 主干：一条竖直的提交线 -->
  <path d="M332 236 V788" stroke="#f0eee6" stroke-width="60" stroke-linecap="round"/>
  <!-- 分支：从主干上弯出去，向右推 -->
